name: Acessibilidade

# Roda em todo Pull Request que mexa no HTML.
#
# Sobre permissões: PRs vindos de fork recebem um GITHUB_TOKEN somente-leitura,
# então este workflow NÃO tenta comentar no PR — isso falharia. Ele escreve o
# relatório no resumo do job, que o aluno abre pela aba "Checks" do PR.
on:
  pull_request:
    paths:
      - '**.html'
      - '.htmlvalidate.json'
      - '.github/workflows/acessibilidade.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificação automática
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conferir que o index.html existe
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html não foi encontrado na raiz do repositório."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 1. Validação de HTML
      # ------------------------------------------------------------------
      - name: Validar o HTML
        id: htmlvalidate
        continue-on-error: true
        run: npx --yes html-validate@8 index.html contato.html > html-validate.txt 2>&1

      # ------------------------------------------------------------------
      # 2. Varredura de acessibilidade (axe-core, WCAG 2.1 AA)
      # ------------------------------------------------------------------
      - name: Instalar o axe-core e o Playwright
        run: |
          npm install --no-save --no-audit --no-fund axe-core@4 playwright@1
          npx playwright install chromium

      - name: Rodar o axe-core
        id: axe
        continue-on-error: true
        run: |
          node .github/scripts/verificar-acessibilidade.mjs index.html > axe.md 2>&1 || true
          echo >> axe.md
          node .github/scripts/verificar-acessibilidade.mjs contato.html >> axe.md 2>&1

      # ------------------------------------------------------------------
      # 3. Relatório no resumo do job
      # ------------------------------------------------------------------
      - name: Montar o relatório
        if: always()
        run: |
          {
            echo "# Relatório de acessibilidade"
            echo
            echo "Arquivo verificado: \`index.html\`"
            echo

            echo "## 1. Validação de HTML"
            echo
            if [ "${{ steps.htmlvalidate.outcome }}" = "success" ]; then
              echo "Nenhum erro de sintaxe HTML encontrado."
            else
              echo "<details><summary>Erros encontrados (clique para abrir)</summary>"
              echo
              echo '```'
              head -c 30000 html-validate.txt 2>/dev/null || echo "(sem saída)"
              echo '```'
              echo
              echo "</details>"
            fi
            echo

            echo "## 2. Varredura WCAG 2.1 AA (axe-core)"
            echo
            head -c 40000 axe.md 2>/dev/null || echo "(sem saída)"
            echo

            echo "---"
            echo
            echo "## Leia antes de comemorar"
            echo
            echo "Na versão original desta página, estas duas ferramentas juntas apontam **menos"
            echo "da metade** dos 34 problemas plantados. Elas **não** detectam:"
            echo
            echo "- textos de link sem sentido isolado (\"clique aqui\", \"saiba mais\")"
            echo "- \`<div>\` fazendo papel de botão, inalcançável pelo teclado"
            echo "- lista simulada com \`<br>\` em vez de \`<ul>\`"
            echo "- tabela usada para layout"
            echo "- \`<td>\` estilizado no lugar de \`<th scope>\`"
            echo "- \`<caption>\` ausente"
            echo "- grupo de campos sem \`<fieldset>\`/\`<legend>\`"
            echo "- \`<b>\`/\`<i>\`/\`<u>\` onde cabia \`<strong>\`/\`<em>\`/\`<ins>\`"
            echo "- texto alternativo que existe mas não descreve nada útil"
            echo "- mensagens de erro genéricas como \"Erro.\""
            echo
            echo "**Um relatório limpo não significa que a página está correta.**"
            echo "O \`CHECKLIST.md\` continua sendo o guia da atividade."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resultado
        if: always()
        run: |
          echo "Validação de HTML: ${{ steps.htmlvalidate.outcome }}"
          echo "Varredura axe:     ${{ steps.axe.outcome }}"
          echo
          echo "Abra o resumo deste job para ver o relatório completo."
          # Este workflow é informativo e não reprova o PR de propósito: o aluno
          # vê o relatório sem levar um X vermelho na entrega.
          # Para torná-lo bloqueante, descomente a linha abaixo.
          # [ "${{ steps.htmlvalidate.outcome }}" = "success" ] || exit 1
